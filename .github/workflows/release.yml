# Release on tag push `vX.Y.Z`:
#   verify (tag == pyproject version, lock fresh, tests, README release-ready) -> build
#   -> publish TestPyPI -> publish PyPI (environment approval) -> GitHub Release
# Publishing uses PyPI Trusted Publishing (OIDC): no API tokens are stored anywhere.
# One-time setup (each index separately):
#   https://pypi.org/manage/account/publishing/       owner=suresh-jbt repo=mcp-check workflow=release.yml environment=pypi
#   GitHub -> Settings -> Environments: create `pypi` (add yourself as a required reviewer).
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false
env:
  UV_VERSION: "0.13.1"
  FORCE_COLOR: "1"
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: false # never restore caches into a release build
          python-version: "3.14"
      - name: Tag must equal [project].version
        env:
          TAG: "${{ github.ref_name }}"
        run: |
          version="$(uv version --short)"
          [ "${TAG#v}" = "$version" ] || { echo "::error::tag '$TAG' != pyproject version '$version'"; exit 1; }
      - run: uv lock --check
      - run: uv sync --locked && uv run --no-sync pytest -q
      - name: README has no TO-BE-REPLACED markers and renders
        run: uv run --no-sync python scripts/check_readme.py README.md CHANGELOG.md CONTRIBUTING.md --release
  build:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: false
          python-version: "3.14"
      - run: uv build
      - run: uvx twine@7.0.0 check --strict dist/*
      - env:
          TAG: "${{ github.ref_name }}"
        run: test "$(uv run --isolated --no-project --with dist/*.whl -- mcpcheck --version)" = "mcpcheck ${TAG#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  # NOTE: there is no TestPyPI dry-run job. The name "mcpcheck" is already taken on
  # test.pypi.org by an unrelated project (uploaded 2026-02-22), so publishing there
  # would fail with 403. Rendering and metadata are instead verified by
  # `twine check --strict` and the isolated wheel smoke test in the build job, and the
  # `pypi` environment below requires a manual approval before anything is published.
  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: "https://pypi.org/p/mcpcheck"
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true # attestations on by default (PEP 740)
  github-release:
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: "${{ github.token }}"
          TAG: "${{ github.ref_name }}"
        run: |
          pre=""; case "$TAG" in *rc*|*a*|*b*) pre="--prerelease";; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag $pre
