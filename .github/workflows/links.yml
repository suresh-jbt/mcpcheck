# Link rot in the specification URLs mcpcheck cites is a real failure mode, but the live
# site must never gate a build: the `network` tests are deselected by default (pyproject
# addopts) and run here on a schedule instead.
name: Spec links
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  anchors:
    name: every spec URL still resolves
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run --no-sync pytest -m network -v
